version: 2.1

orbs:
  # Snyk-owned orbs: track the latest release of the major version
  prodsec: snyk/prodsec-orb@1
  # Third-party orbs: always pin an exact version
  win: circleci/windows@5.1.1

defaults: &defaults
  parameters:
    node_version:
      type: string
      default: ""

commands:
  npmrc:
    steps:
      - run:
          name: Create .npmrc
          command: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc

  setup_git:
    steps:
      - run:
          name: "Setup git environment"
          command: git config --global core.autocrlf false

  install_node_npm:
    <<: *defaults
    description: Install specific version of Node
    steps:
      - run:
          name: Installing node version << parameters.node_version >>
          command: nvm install << parameters.node_version >>
      - run:
          name: Using node version << parameters.node_version >>
          command: nvm use << parameters.node_version >>

  show_node_npm_version:
    description: Log Node and npm version
    steps:
      - run:
          name: Node version
          command: node --version
      - run:
          name: NPM version
          command: npm --version

  install_deps:
    description: Install dependencies
    steps:
      - run:
          name: Install npm dependencies
          command: npm install
jobs:
  security-scans:
    docker:
      - image: cimg/node:24
    resource_class: small
    steps:
      - checkout
      - show_node_npm_version
      - install_deps
      - prodsec/security_scans:
          mode: auto
          release-branch: master
          open-source-additional-arguments: --exclude=test
          iac-scan: disabled
          # code-scan not compatible with test .snyk file in test/fixtures/to-exclude-paths (which cannot be excluded)
          code-scan: disabled

  lint:
    <<: *defaults
    docker:
      - image: cimg/node:<< parameters.node_version >>
    steps:
      - checkout
      - show_node_npm_version
      - install_deps
      - run:
          name: Run lint
          command: npm run lint

  test-windows:
    <<: *defaults
    environment:
      npm_config_loglevel: silent
    executor:
      name: win/default
    steps:
      - setup_git
      - checkout
      - install_node_npm:
          node_version: << parameters.node_version >>
      - show_node_npm_version
      - install_deps
      - run:
          name: Run tests
          command: npm test

  test-unix:
    <<: *defaults
    docker:
      - image: cimg/node:<< parameters.node_version >>
    resource_class: large
    steps:
      - checkout
      - show_node_npm_version
      - install_deps
      - run:
          name: Run tests
          command: npm test

  release:
    <<: *defaults
    docker:
      - image: cimg/node:<< parameters.node_version >>
    resource_class: small
    steps:
      - checkout
      - install_deps
      # Writes the read-only NPM_TOKEN (from the nodejs-install context) to
      # .npmrc so @semantic-release/npm's verifyConditions step passes on
      # CircleCI (it has no OIDC code path and otherwise fails with
      # ENONPMTOKEN). The actual publish is done by the bundled npm CLI via
      # OIDC trusted publishing using NPM_ID_TOKEN below.
      - npmrc
      - run:
          name: Release
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud": "npm:registry.npmjs.org"}')
            npx semantic-release@25

workflows:
  version: 2
  test_and_release:
    jobs:
      - prodsec/secrets-scan:
          name: Scan repository for secrets
          context:
            - snyk-bot-slack
            - prodsec-orb-runtime
          channel: snyk-vuln-alerts-sca-scanners
          filters:
            branches:
              ignore:
                - master

      - security-scans:
          name: Security Scans
          context:
            - engines_sca-scanners
            - nodejs-install
            - prodsec-orb-runtime

      - lint:
          name: lint
          context: nodejs-install
          node_version: "24"

      # UNIX tests
      - test-unix:
          name: Unix Tests for Node << matrix.node_version >>
          context: nodejs-install
          requires:
            - lint
          matrix:
            parameters:
              node_version: ["22", "24", "26"]

      # Windows tests
      - test-windows:
          name: Windows Tests for Node << matrix.node_version >>
          requires:
            - lint
          matrix:
            parameters:
              # nvm-windows can't resolve bare majors such as "22": pin full versions
              node_version: ["22.23.5", "24.22.3", "26.13.1"]

      - release:
          name: Release
          context:
            - nodejs-install
            - github-release
          node_version: "24"  # npm 11+ (Node 24) is needed for OIDC trusted publishing
          requires:
            - lint
            - test-unix
            - test-windows
          filters:
            branches:
              only:
                - master
